[package]
name = "ephemeral-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["net", "rt-multi-thread", "macros", "signal", "time", "sync"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
